name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  terminal:
    needs: test
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet publish src/Terminal --configuration Release --runtime ${{ matrix.rid }} --output publish -p:Version=$VERSION
      - name: Pack
        run: |
          mkdir dist
          name=mayfly-$VERSION-${{ matrix.rid }}
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "dist/$name.zip" ./publish/mayfly.exe
          else
            tar -czf "dist/$name.tar.gz" -C publish mayfly
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: mayfly-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Image tags
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          tags=$image:$version
          if [[ $version != *-* ]]; then
            tags+=,$image:latest
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.TAGS }}
          push: true

  browser-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Browser/package-lock.json
      - run: npm ci
        working-directory: src/Browser
      - run: npm run check
        working-directory: src/Browser
      - name: Image tags
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/${GITHUB_REPOSITORY,,}-browser
          tags=$image:$version
          if [[ $version != *-* ]]; then
            tags+=,$image:latest
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: src/Browser
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.TAGS }}
          push: true

  release:
    needs: [terminal, image, browser-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum mayfly-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag "${flags[@]}"
