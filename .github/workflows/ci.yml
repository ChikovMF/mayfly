name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build --configuration Release
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Publish console app
        run: dotnet publish src/Terminal --configuration Release --runtime linux-x64

  browser:
    name: Web frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Browser/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
